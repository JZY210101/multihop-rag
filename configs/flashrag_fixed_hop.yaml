# FlashRAG 原生配置。当前数据目录结构：data_dir/dataset_name/{train,dev}.jsonl
data_dir: "data/FlashRAG_Data/"
save_dir: "outputs/"
dataset_name: "hotpotqa"
split: ["dev"]
test_sample_num: ~
random_sample: false
retrieval_method: "bm25"
index_path: "data/index/bm25"
corpus_path: "data/wiki_corpus.jsonl"
retrieval_topk: 5
bm25_backend: "bm25s"
framework: "hf"
generator_model: "model/Qwen3-4B-Instruct-2507"
generator_model_path: "model/Qwen3-4B-Instruct-2507"
generation_params:
  max_tokens: 256
  do_sample: false
generator_max_input_len: 3840
generator_batch_size: 1
save_intermediate_data: false
save_retrieval_cache: false
use_retrieval_cache: false
metrics: ["em", "f1", "acc", "precision", "recall"]
fixed_hop_from: "auto"
default_hop_num: 2
hallucination_f1_threshold: 0.30
