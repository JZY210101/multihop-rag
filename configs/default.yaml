# 项目控制参数
dataset: hotpotqa
data_path: data/hotpotqa.json
corpus_path: data/wiki_corpus.jsonl
output_path: outputs/hotpotqa.jsonl
backend: flashrag
retriever: bm25
top_k: 5
default_hop_num: 2
hallucination_f1_threshold: 0.30

# FlashRAG / Generator 参数
generator_model: model/Qwen3-4B-Instruct-2507
retrieval_method: bm25
retrieval_topk: 5
index_path: data/index/bm25
model_name: model/Qwen3-4B-Instruct-2507
max_new_tokens: 256
temperature: 0.0
generator_max_input_len: 3840
