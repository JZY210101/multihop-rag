# Qwen ReDeEP detection settings. Input files are generated by src.run_oracle.
model_name: "model/Qwen3-4B-Instruct-2507"
device: ~
device_map: "auto"
torch_dtype: "auto"
label_mode: "f1_answer"  # Legacy flag name; shared EM/F1 plus whole-word yes/no rules.
f1_threshold: 0.30  # Non-boolean answers pass on EM=1 or F1>=0.30.
top_heads: 32
top_layers: 32
top_fraction: 0.10
pks_batch_size: 8
validation_fraction: 0.20
seed: 42
max_input_tokens: 4096
max_records: ~
