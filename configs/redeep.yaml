# Qwen ReDeEP detection settings.  The input files are generated by
# src.run with fixed_hop_trace/redeep_records enabled.
model_name: "model/Qwen3-4B-Instruct-2507"
device: ~
device_map: "auto"
torch_dtype: "auto"
granularity: "token"
label_mode: "f1_answer"
f1_threshold: 0.30
top_heads: 8
top_layers: 8
top_fraction: 0.10
chunk_size: 400
pks_batch_size: 8
embedding_model: ~
max_input_tokens: 4096
max_records: ~
